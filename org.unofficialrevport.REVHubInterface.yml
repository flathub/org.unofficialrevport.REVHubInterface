id: org.unofficialrevport.REVHubInterface
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: REVHubInterface.sh
finish-args:
  - --device=all
  - --share=ipc
  - --socket=x11
cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/man
  - '*.a'
modules:
  - python3-requirements.json
  - tkinter.json

  - name: revhubinterface
    buildsystem: simple
    build-commands:
      - python -m setuptools_scm --force-write-version-files
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} . --no-build-isolation
      - install -Dm755 REVHubInterface.sh -t /app/bin/
      - install -Dm644 flatpak/${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -Dm644 ${FLATPAK_ID}.svg -t /app/share/icons/hicolor/scalable/apps/
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
    sources:
      - type: git
        url: https://github.com/unofficial-rev-port/REVHubInterface.git
        commit: ff2966db90efe3f6e46e748f0cdf0680dacb66f8
        disable-shallow-clone: true
