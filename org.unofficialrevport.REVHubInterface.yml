id: org.unofficialrevport.REVHubInterface
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: REVHubInterface.sh
finish-args:
  - --device=all
  - --share=ipc
  - --socket=x11
modules:
  - python3-requirements.json
  - name: tkinter
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} --no-build-isolation .
    sources:
      - type: git
        url: https://github.com/iwalton3/tkinter-standalone
        commit: 8e78e38ef0cceb44a3a0062e1c314a4ff3f981db
    modules:
      - name: tcl9.0
        subdir: unix
        config-opts:
          - --disable-zipfs
        post-install:
          - chmod +w ${FLATPAK_DEST}/lib/libtcl9.0.so
        sources:
          - type: archive
            url: https://sourceforge.net/projects/tcl/files/Tcl/9.0.4/tcl9.0.4-src.tar.gz
            sha256: d0aed49230bc02a65c1e0229e65f34590a4b037ec40d546f32573b467f7551ea
            x-checker-data:
              type: html
              url: https://sourceforge.net/projects/tcl/rss
              pattern: <link>(https://sourceforge.net/.+/tcl(9\.0\.\d+)-src\.tar\.gz)/download
      - name: tk9.0
        subdir: unix
        config-opts:
          - --disable-zipfs
        post-install:
          - chmod +w ${FLATPAK_DEST}/lib/libtcl9tk9.0.so
        sources:
          - type: archive
            url: https://sourceforge.net/projects/tcl/files/Tcl/9.0.4/tk9.0.4-src.tar.gz
            sha256: d7a146d2917eb8b5cc95276dbf0e3d03c7464d2b19c1675357857c989301dbb4
            x-checker-data:
              type: html
              url: https://sourceforge.net/projects/tcl/rss
              pattern: <link>(https://sourceforge.net/.+/tk(9\.0\.\d+)-src\.tar\.gz)/download
  - name: revhubinterface
    buildsystem: simple
    build-commands:
      - python -m setuptools_scm --force-write-version-files
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} . --no-build-isolation
      - install -Dm755 REVHubInterface.sh /app/bin/REVHubInterface.sh
      - install -Dm644 -t /app/share/applications flatpak/org.unofficialrevport.REVHubInterface.desktop
      - install -Dm644 -t /app/share/icons/hicolor/scalable/apps org.unofficialrevport.REVHubInterface.svg
      - install -Dm644 -t /app/share/metainfo org.unofficialrevport.REVHubInterface.metainfo.xml
    sources:
      - type: git
        url: https://github.com/unofficial-rev-port/REVHubInterface.git
        commit: d75c078a6253629544ffcef8ac5c8b1b23febfef
        disable-shallow-clone: true

